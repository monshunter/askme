name: askme-local

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${ASKME_POSTGRES_USER:-askme}:${ASKME_POSTGRES_PASSWORD:-askme-local-only}@db:5432/${ASKME_POSTGRES_DB:-askme}

x-runtime-environment: &runtime-environment
  <<: *database-environment
  UPLOAD_ROOT: /data/uploads
  ASKME_REPOSITORY_ARTIFACT_ROOT: /data/repository-artifacts
  ASKME_PUBLIC_BASE_URL: ${ASKME_PUBLIC_BASE_URL:-https://askme.monshunter.xyz/}
  ASKME_AI_API_KEY: ${ASKME_AI_API_KEY:-}
  ASKME_AI_BASE_URL: ${ASKME_AI_BASE_URL:-https://api.deepseek.com/v1}
  ASKME_AI_ROUTER_MODEL: ${ASKME_AI_ROUTER_MODEL:-deepseek-v4-flash}
  ASKME_AI_ROUTER_THINKING: ${ASKME_AI_ROUTER_THINKING:-off}
  ASKME_AI_RAG_MODEL: ${ASKME_AI_RAG_MODEL:-deepseek-v4-flash}
  ASKME_AI_RAG_THINKING: ${ASKME_AI_RAG_THINKING:-off}
  ASKME_AI_CODE_MODEL: ${ASKME_AI_CODE_MODEL:-deepseek-v4-flash}
  ASKME_AI_CODE_THINKING: ${ASKME_AI_CODE_THINKING:-high}
  ASKME_AI_CODE_CONTEXT_WINDOW: ${ASKME_AI_CODE_CONTEXT_WINDOW:-1000000}
  ASKME_AI_CODE_MAX_TOKENS: ${ASKME_AI_CODE_MAX_TOKENS:-200000}
  ASKME_AI_PLANNER_MODEL: ${ASKME_AI_PLANNER_MODEL:-deepseek-v4-flash}
  ASKME_AI_PLANNER_THINKING: ${ASKME_AI_PLANNER_THINKING:-off}
  ASKME_AI_VERIFIER_MODEL: ${ASKME_AI_VERIFIER_MODEL:-deepseek-v4-flash}
  ASKME_AI_VERIFIER_THINKING: ${ASKME_AI_VERIFIER_THINKING:-off}
  ASKME_EMBEDDING_MODEL_API_KEY: ${ASKME_EMBEDDING_MODEL_API_KEY:-}
  ASKME_EMBEDDING_MODEL_API_BASE_URL: ${ASKME_EMBEDDING_MODEL_API_BASE_URL:-}
  ASKME_EMBEDDING_MODEL: ${ASKME_EMBEDDING_MODEL:-qwen3.7-text-embedding}
  ASKME_EMBEDDING_DIMENSIONS: ${ASKME_EMBEDDING_DIMENSIONS:-1024}
  ASKME_EMBEDDING_TIMEOUT_MS: ${ASKME_EMBEDDING_TIMEOUT_MS:-20000}
  ASKME_EMBEDDING_MAX_RETRIES: ${ASKME_EMBEDDING_MAX_RETRIES:-1}
  ASKME_EMBEDDING_BATCH_SIZE: ${ASKME_EMBEDDING_BATCH_SIZE:-16}
  ASKME_EMBEDDING_CONCURRENCY: ${ASKME_EMBEDDING_CONCURRENCY:-2}
  ASKME_RERANK_MODEL_API_KEY: ${ASKME_RERANK_MODEL_API_KEY:-}
  ASKME_RERANK_MODEL_API_BASE_URL: ${ASKME_RERANK_MODEL_API_BASE_URL:-}
  ASKME_RERANK_MODEL: ${ASKME_RERANK_MODEL:-qwen3-rerank}
  ASKME_RERANK_PROVIDER_PROTOCOL: ${ASKME_RERANK_PROVIDER_PROTOCOL:-dashscope-compatible}
  ASKME_RERANK_TIMEOUT_MS: ${ASKME_RERANK_TIMEOUT_MS:-20000}
  ASKME_RERANK_MAX_RETRIES: ${ASKME_RERANK_MAX_RETRIES:-1}
  ASKME_RERANK_TOP_N: ${ASKME_RERANK_TOP_N:-8}
  ASKME_RAG_POLICY_VERSION: ${ASKME_RAG_POLICY_VERSION:-hybrid-rag-v2}
  ASKME_RAG_EXACT_TOP_K: ${ASKME_RAG_EXACT_TOP_K:-20}
  ASKME_RAG_LEXICAL_TOP_K: ${ASKME_RAG_LEXICAL_TOP_K:-30}
  ASKME_RAG_VECTOR_TOP_K: ${ASKME_RAG_VECTOR_TOP_K:-30}
  ASKME_RAG_STRUCTURED_TOP_K: ${ASKME_RAG_STRUCTURED_TOP_K:-20}
  ASKME_RAG_EXACT_WEIGHT: ${ASKME_RAG_EXACT_WEIGHT:-1.5}
  ASKME_RAG_LEXICAL_WEIGHT: ${ASKME_RAG_LEXICAL_WEIGHT:-1}
  ASKME_RAG_VECTOR_WEIGHT: ${ASKME_RAG_VECTOR_WEIGHT:-1}
  ASKME_RAG_STRUCTURED_WEIGHT: ${ASKME_RAG_STRUCTURED_WEIGHT:-1.2}
  ASKME_RAG_RRF_K: ${ASKME_RAG_RRF_K:-60}
  ASKME_RAG_MAX_CHILDREN_PER_PARENT: ${ASKME_RAG_MAX_CHILDREN_PER_PARENT:-3}
  ASKME_RAG_RETRIEVAL_MAX_ROUNDS: ${ASKME_RAG_RETRIEVAL_MAX_ROUNDS:-2}
  ASKME_RAG_EVIDENCE_MAX_TOKENS: ${ASKME_RAG_EVIDENCE_MAX_TOKENS:-200000}
  ASKME_RAG_OUTPUT_RESERVE_TOKENS: ${ASKME_RAG_OUTPUT_RESERVE_TOKENS:-8000}
  ASKME_RAG_SAFETY_MARGIN_TOKENS: ${ASKME_RAG_SAFETY_MARGIN_TOKENS:-4000}
  ASKME_RAG_CHILD_TARGET_TOKENS: ${ASKME_RAG_CHILD_TARGET_TOKENS:-420}
  ASKME_RAG_CHILD_MIN_TOKENS: ${ASKME_RAG_CHILD_MIN_TOKENS:-80}
  ASKME_RAG_CHILD_HARD_MAX_TOKENS: ${ASKME_RAG_CHILD_HARD_MAX_TOKENS:-650}
  ASKME_RAG_PARENT_MIN_TOKENS: ${ASKME_RAG_PARENT_MIN_TOKENS:-900}
  ASKME_RAG_PARENT_MAX_TOKENS: ${ASKME_RAG_PARENT_MAX_TOKENS:-1500}
  ASKME_RAG_OVERLAP_TOKENS: ${ASKME_RAG_OVERLAP_TOKENS:-48}
  ASKME_REPOSITORY_DOCUMENT_INCLUDE: ${ASKME_REPOSITORY_DOCUMENT_INCLUDE:-README*.md,*.md,docs/**/*.md,docs/**/*.pdf}
  ASKME_REPOSITORY_DOCUMENT_EXCLUDE: ${ASKME_REPOSITORY_DOCUMENT_EXCLUDE:-**/node_modules/**,**/.git/**,**/dist/**,**/build/**,**/coverage/**}
  ASKME_REPOSITORY_MARKDOWN_MAX_BYTES: ${ASKME_REPOSITORY_MARKDOWN_MAX_BYTES:-2097152}
  ASKME_REPOSITORY_PDF_MAX_BYTES: ${ASKME_REPOSITORY_PDF_MAX_BYTES:-52428800}
  ASKME_REPOSITORY_PDF_MAX_PAGES: ${ASKME_REPOSITORY_PDF_MAX_PAGES:-500}
  ASKME_REPOSITORY_REVISION_MAX_TOKENS: ${ASKME_REPOSITORY_REVISION_MAX_TOKENS:-5000000}
  ASKME_CODE_AGENT_IMAGE_DIGEST: ${ASKME_CODE_AGENT_IMAGE_DIGEST:-}
  ASKME_CODE_AGENT_MAX_ROUNDS: ${ASKME_CODE_AGENT_MAX_ROUNDS:-50}
  ASKME_CODE_AGENT_MAX_TOOL_CALLS: ${ASKME_CODE_AGENT_MAX_TOOL_CALLS:-80}
  ASKME_CODE_AGENT_REPOSITORY_DAILY_QUOTA: ${ASKME_CODE_AGENT_REPOSITORY_DAILY_QUOTA:-10}
  ASKME_CODE_AGENT_REPOSITORY_ANALYSIS_TIMEOUT_MS: ${ASKME_CODE_AGENT_REPOSITORY_ANALYSIS_TIMEOUT_MS:-1200000}
  ASKME_SMTP_HOST: ${ASKME_SMTP_HOST:-mailpit}
  ASKME_SMTP_PORT: ${ASKME_SMTP_PORT:-1025}
  ASKME_SMTP_SECURE: ${ASKME_SMTP_SECURE:-false}
  ASKME_SMTP_USER: ${ASKME_SMTP_USER:-}
  ASKME_SMTP_PASSWORD: ${ASKME_SMTP_PASSWORD:-}
  ASKME_SMTP_FROM: "${ASKME_SMTP_FROM:-Askme <noreply@askme.local>}"

services:
  db:
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ASKME_POSTGRES_DB:-askme}
      POSTGRES_USER: ${ASKME_POSTGRES_USER:-askme}
      POSTGRES_PASSWORD: ${ASKME_POSTGRES_PASSWORD:-askme-local-only}
    ports:
      - "127.0.0.1:${ASKME_POSTGRES_PORT:-55432}:5432"
    volumes:
      - askme_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ASKME_POSTGRES_USER:-askme} -d ${ASKME_POSTGRES_DB:-askme}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["sh", "-c", "npm run db:migrate && npm run db:bootstrap"]
    environment:
      <<: *database-environment
      ASKME_CANDIDATE_EMAIL: ${ASKME_CANDIDATE_EMAIL:-candidate@askme.local}
      ASKME_CANDIDATE_PASSWORD: ${ASKME_CANDIDATE_PASSWORD:-Candidate-local-2026!}
      ASKME_ADMIN_EMAIL: ${ASKME_ADMIN_EMAIL:-admin@askme.local}
      ASKME_ADMIN_PASSWORD: ${ASKME_ADMIN_PASSWORD:-Admin-local-2026!}
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASKME_MAILPIT_PORT:-8025}:8025"

  web:
    build: .
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      ALLOW_INSECURE_LOCAL_COOKIE: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${ASKME_WEB_PORT:-3000}:3000"
    volumes:
      - askme_uploads:/data/uploads
      - ${ASKME_REPOSITORY_ARTIFACT_HOST_ROOT:-./data/repository-artifacts}:/data/repository-artifacts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment: *runtime-environment
    volumes:
      - askme_uploads:/data/uploads
      - ${ASKME_REPOSITORY_ARTIFACT_HOST_ROOT:-./data/repository-artifacts}:/data/repository-artifacts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  askme_pgdata:
    name: ${ASKME_POSTGRES_VOLUME:-askme_local_pgdata}
  askme_uploads:
    name: ${ASKME_UPLOAD_VOLUME:-askme_local_uploads}
